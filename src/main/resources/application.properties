spring.application.name=jobportal
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=JobPortalDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=jobuser
spring.datasource.password=Job@12345

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# JWT Configuration (Senior Standard)
